name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Compile Python files
        shell: pwsh
        run: |
          $files = @(
            "plugin/agent/auxiliary-fallbacks/dashboard/plugin_api.py",
            "scripts/plugin_state.py",
            "scripts/profile_targets.py",
            "scripts/vision_fallback_smoke.py"
          )
          python -m py_compile @files

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check the Desktop plugin syntax
        run: node --check plugin/desktop/auxiliary-fallbacks/plugin.js

      - name: Parse the PowerShell scripts
        shell: powershell
        run: |
          $files = @("scripts/install.ps1", "scripts/uninstall.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }
